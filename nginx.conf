worker_processes 1;
worker_rlimit_nofile 1024;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    default_type application/octet-stream;
    
    server_tokens off;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    sendfile on;
    tcp_nopush on; 
    tcp_nodelay on;

    client_body_buffer_size 10k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    keepalive_timeout 20s;
    keepalive_requests 100;
    client_max_body_size 10M; 
    client_body_timeout 10s;
    send_timeout 10s;

    gzip on;
    gzip_comp_level 6; 
    gzip_min_length 128; 
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/xml
        image/svg+xml;

    limit_conn_zone $binary_remote_addr zone=conn_limit:1m;

    upstream eagler_backend {
        server 89.117.77.192:25567;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        limit_conn conn_limit 15;

        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE)$) {
            return 444; 
        }

        if ($request_method = HEAD) {
            return 200;
        }

        location / {
            proxy_pass http://eagler_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 5s;
        }
    }
}
