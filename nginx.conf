http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name spookproxy.onrender.com eagler.spook.qzz.io;

        location /chat/ {
            proxy_pass http://5.231.32.245:25574;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            return 200 "ok";
        }
    }
}
