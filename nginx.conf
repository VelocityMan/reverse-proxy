worker_processes 1;
# Lowered from 200,000 to save memory overhead per worker
worker_rlimit_nofile 4096;

events {
    # Lowered from 8192. 2048 is plenty and saves RAM allocated for connection states.
    worker_connections 2048;
    multi_accept on;
}

http {
    default_type application/octet-stream;

    # --- Performance ---
    sendfile on;
    tcp_nopush off;
    tcp_nodelay on;

    # --- MEMORY FIX: Timeouts ---
    # 3600s (1 hour) is a massive memory hog. It keeps idle HTTP connections open in RAM.
    # Reduced to 65 seconds, which is standard.
    keepalive_timeout 65s;
    keepalive_requests 1000;

    # Set a reasonable limit instead of 0 (unlimited) to prevent memory exhaustion from massive uploads
    client_max_body_size 50M; 
    client_body_timeout 60s;
    send_timeout 60s;

    # --- CPU OPTIMIZATION: GZIP ---
    gzip on;
    # Lowered from 5 to 2. Level 2 gives 90% of the file size reduction but uses significantly less CPU.
    gzip_comp_level 2; 
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css;

    # --- WebSocket upgrade ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --- Connection limiting ---
    # Reduced shared memory zone from 10m to 1m. 1MB can hold ~16,000 IP states, saving 9MB of RAM.
    limit_conn_zone $binary_remote_addr zone=conn_limit:1m;

    server {
        listen 80;
        server_name _;

        limit_conn conn_limit 40;

        # --- Render HEAD probes ---
        if ($request_method = HEAD) {
            return 200;
        }

        location / {
            proxy_pass http://89.117.77.192:25645;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;

            # Kept at 3600s to allow long-lived WebSockets. 
            # (If you aren't using WebSockets, reduce these to 60s too!)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 15s;
        }
    }
}
