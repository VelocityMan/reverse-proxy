worker_processes 1;
# Reduced to the bare minimum needed for a small proxy
worker_rlimit_nofile 1024;

events {
    # 512 is plenty for a free tier. It prevents memory allocation waste.
    worker_connections 512;
    multi_accept on;
}

http {
    default_type application/octet-stream;

    # --- Disk & Network Efficiency ---
    sendfile on;
    # tcp_nopush packs data into full TCP packets, saving bandwidth overhead
    tcp_nopush on; 
    tcp_nodelay on;

    # --- EXTREME RAM SAVERS: Micro Buffers ---
    # These prevent bad actors from opening massive headers and eating your 512MB RAM
    client_body_buffer_size 10k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # Shorter timeouts clear out idle users faster
    keepalive_timeout 20s;
    keepalive_requests 100;
    client_max_body_size 10M; 
    client_body_timeout 10s;
    send_timeout 10s;

    # --- 5GB BANDWIDTH SAVER: Maximum Safe GZIP ---
    gzip on;
    # Level 6 is the sweet spot. It compresses files significantly more than level 2, saving your 5GB limit, without maxing out your CPU.
    gzip_comp_level 6; 
    # Compress even tiny files to save every byte
    gzip_min_length 128; 
    gzip_vary on;
    gzip_proxied any;
    # Added XML and SVG to catch more compressible assets
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/xml
        image/svg+xml;

    # 1MB zone tracks up to 16,000 IPs with minimal RAM
    limit_conn_zone $binary_remote_addr zone=conn_limit:1m;

    server {
        listen 80;
        server_name _;

        # Dropped from 40 to 15 concurrent connections per IP. Stops abusers from draining your bandwidth.
        limit_conn conn_limit 15;

        # --- 5GB BANDWIDTH SAVER: Drop bots immediately ---
        # If a request isn't a standard web request, drop the connection with 0 bytes sent (444).
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE)$) {
            return 444; 
        }

        # Render HEAD probes
        if ($request_method = HEAD) {
            return 200;
        }

        location / {
            proxy_pass http://89.117.77.192:25567;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;

            # If you are doing real-time WebSockets (like a game or chat), leave these high.
            # If you are NOT using WebSockets, drop these to 30s to save memory.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 5s;
        }
    }
}
