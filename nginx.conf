events {
    worker_connections 1024;
    # Render likes seeing logs early so it knows the container is alive
    log_notices on;
}

http {
    # Log format for Render
    log_format render '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'upgrade:$http_upgrade connection:$connection_upgrade';

    access_log /dev/stdout render;
    error_log  /dev/stderr notice;

    # Map upgrade header to connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Log startup event
        # Render sees this and knows the container is alive
        add_header X-Started "NGRIX Render Proxy Started";

        # Eaglercraft WebSocket endpoint
        location /server/ {
            proxy_pass http://141.145.215.131:20090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Chat WebSocket endpoint
        location /chat/ {
            proxy_pass http://141.145.215.131:20090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Web assets
        location /web/ {
            proxy_pass http://141.145.215.131:20090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Catch‑all fallback
        location / {
            proxy_pass http://141.145.215.131:20090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
    }
}
