events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # Serve the Eaglercraft client files
        root /home/runner/eaglercraft-server/web;  # <-- SAME AS THE WORKING CONFIG YOU FOUND
        index index.html;

        # WebSocket endpoint
        location /server {
            proxy_pass http://98.201.228.48:25565;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Optional: if your backend uses these
        location /web/ {
            proxy_pass http://98.201.228.48:25565;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /chat/ {
            proxy_pass http://98.201.228.48:25565;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
